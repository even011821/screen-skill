<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shell/CardShell/Style08</title>
  <link rel="stylesheet" href="./shell.css">
  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #071213;
      color: #ebffff;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 40px;
    }

    .preview-stage {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, auto));
      gap: 32px;
      align-items: start;
    }

    .preview-card {
      position: relative;
    }

    .preview-card--base {
      width: 400px;
      height: 300px;
    }

    .preview-card--wide {
      width: 720px;
      height: 360px;
    }

    @media (max-width: 1220px) {
      body {
        place-items: start center;
        padding: 24px;
      }

      .preview-stage {
        grid-template-columns: 1fr;
      }

      .preview-card--wide {
        width: min(720px, calc(100vw - 48px));
      }
    }
  </style>
</head>
<body>
  <main class="preview-stage">
    <section class="preview-card preview-card--base">
      <section class="bs-card-shell bs-card-shell--style08" data-kit="Shell/CardShell/Style08">
        <div class="bs-card-shell__background" aria-hidden="true">
          <span class="bs-card-shell__fill"></span>
          <span class="bs-card-shell__edge bs-card-shell__edge--left"></span>
          <span class="bs-card-shell__edge bs-card-shell__edge--right"></span>
          <span class="bs-card-shell__edge bs-card-shell__edge--bottom"></span>
          <span class="bs-card-shell__bottom-corner bs-card-shell__bottom-corner--left"></span>
          <span class="bs-card-shell__bottom-corner bs-card-shell__bottom-corner--right"></span>
        </div>
        <header class="bs-card-shell__header" data-node-id="51:24405">
          <span class="bs-card-shell__header-left-bg" aria-hidden="true"></span>
          <span class="bs-card-shell__header-left-overlay" aria-hidden="true"></span>
          <span class="bs-card-shell__header-body-shape" aria-hidden="true"></span>
          <span class="bs-card-shell__header-glow" aria-hidden="true"></span>
          <span class="bs-card-shell__header-body-fill" aria-hidden="true"></span>
          <span class="bs-card-shell__header-path-main" aria-hidden="true"></span>
          <span class="bs-card-shell__header-icon-shape" aria-hidden="true"></span>
          <span class="bs-card-shell__header-title-line" aria-hidden="true"></span>
          <span class="bs-card-shell__header-tail-line" aria-hidden="true"></span>
          <span class="bs-card-shell__header-right-edge" aria-hidden="true"></span>
          <span class="bs-card-shell__header-stripes" aria-hidden="true"></span>
          <h3 class="bs-card-shell__title" data-slot="title">卡片标题名称</h3>
        </header>
        <div class="bs-card-shell__content" data-slot="content"></div>
      </section>
    </section>

    <section class="preview-card preview-card--wide">
      <section class="bs-card-shell bs-card-shell--style08" data-kit="Shell/CardShell/Style08">
        <div class="bs-card-shell__background" aria-hidden="true">
          <span class="bs-card-shell__fill"></span>
          <span class="bs-card-shell__edge bs-card-shell__edge--left"></span>
          <span class="bs-card-shell__edge bs-card-shell__edge--right"></span>
          <span class="bs-card-shell__edge bs-card-shell__edge--bottom"></span>
          <span class="bs-card-shell__bottom-corner bs-card-shell__bottom-corner--left"></span>
          <span class="bs-card-shell__bottom-corner bs-card-shell__bottom-corner--right"></span>
        </div>
        <header class="bs-card-shell__header" data-node-id="51:24405">
          <span class="bs-card-shell__header-left-bg" aria-hidden="true"></span>
          <span class="bs-card-shell__header-left-overlay" aria-hidden="true"></span>
          <span class="bs-card-shell__header-body-shape" aria-hidden="true"></span>
          <span class="bs-card-shell__header-glow" aria-hidden="true"></span>
          <span class="bs-card-shell__header-body-fill" aria-hidden="true"></span>
          <span class="bs-card-shell__header-path-main" aria-hidden="true"></span>
          <span class="bs-card-shell__header-icon-shape" aria-hidden="true"></span>
          <span class="bs-card-shell__header-title-line" aria-hidden="true"></span>
          <span class="bs-card-shell__header-tail-line" aria-hidden="true"></span>
          <span class="bs-card-shell__header-right-edge" aria-hidden="true"></span>
          <span class="bs-card-shell__header-stripes" aria-hidden="true"></span>
          <h3 class="bs-card-shell__title" data-slot="title">宽屏自适应标题</h3>
        </header>
        <div class="bs-card-shell__content" data-slot="content"></div>
      </section>
    </section>
  </main>
</body>
</html>
