<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shell/CardShell/Style09 Preview</title>
  <link rel="stylesheet" href="./shell.css">
  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 50% 42%, rgba(42, 145, 243, 0.16), transparent 36%),
        linear-gradient(180deg, #061731 0%, #07112b 100%);
      color: #d7ecff;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    body {
      display: grid;
      place-items: center;
      padding: 40px;
      overflow-x: hidden;
    }

    .style09-preview {
      display: grid;
      grid-template-columns: minmax(300px, 400px) minmax(360px, 720px);
      gap: 28px;
      align-items: start;
      width: min(1180px, 100%);
    }

    .style09-preview__item {
      width: 100%;
      height: 300px;
    }

    .style09-preview__item--wide {
      height: 360px;
    }

    .style09-preview__item--compact {
      width: 320px;
      height: 220px;
    }

    @media (max-width: 860px) {
      body {
        padding: 20px;
      }

      .style09-preview {
        grid-template-columns: 1fr;
      }

      .style09-preview__item,
      .style09-preview__item--wide,
      .style09-preview__item--compact {
        width: 100%;
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <main class="style09-preview">
    <section class="style09-preview__item">
      <section class="bs-card-shell bs-card-shell--style09" data-kit="Shell/CardShell/Style09">
        <div class="bs-card-shell__frame" aria-hidden="true"></div>
        <div class="bs-card-shell__header-bg" aria-hidden="true"></div>
        <div class="bs-card-shell__right-cap" aria-hidden="true"></div>
        <div class="bs-card-shell__line" aria-hidden="true"></div>
        <div class="bs-card-shell__top-hairline" aria-hidden="true"></div>
        <div class="bs-card-shell__left-bar" aria-hidden="true"></div>
        <span class="bs-card-shell__right-stripes" aria-hidden="true"></span>
        <svg class="bs-card-shell__icon" viewBox="0 0 22.627 22.627" aria-hidden="true">
          <polygon class="bs-card-shell__icon-ring" points="11.313,0 22.627,11.313 11.313,22.627 0,11.313"></polygon>
          <polygon class="bs-card-shell__icon-dot" points="11.313,7.354 15.273,11.313 11.313,15.273 7.354,11.313"></polygon>
        </svg>
        <header class="bs-card-shell__header">
          <h3 class="bs-card-shell__title" data-slot="title">卡片标题名称</h3>
        </header>
        <div class="bs-card-shell__content" data-slot="content"></div>
      </section>
    </section>

    <section class="style09-preview__item style09-preview__item--wide">
      <section class="bs-card-shell bs-card-shell--style09" data-kit="Shell/CardShell/Style09">
        <div class="bs-card-shell__frame" aria-hidden="true"></div>
        <div class="bs-card-shell__header-bg" aria-hidden="true"></div>
        <div class="bs-card-shell__right-cap" aria-hidden="true"></div>
        <div class="bs-card-shell__line" aria-hidden="true"></div>
        <div class="bs-card-shell__top-hairline" aria-hidden="true"></div>
        <div class="bs-card-shell__left-bar" aria-hidden="true"></div>
        <span class="bs-card-shell__right-stripes" aria-hidden="true"></span>
        <svg class="bs-card-shell__icon" viewBox="0 0 22.627 22.627" aria-hidden="true">
          <polygon class="bs-card-shell__icon-ring" points="11.313,0 22.627,11.313 11.313,22.627 0,11.313"></polygon>
          <polygon class="bs-card-shell__icon-dot" points="11.313,7.354 15.273,11.313 11.313,15.273 7.354,11.313"></polygon>
        </svg>
        <header class="bs-card-shell__header">
          <h3 class="bs-card-shell__title" data-slot="title">宽屏自适应标题</h3>
        </header>
        <div class="bs-card-shell__content" data-slot="content"></div>
      </section>
    </section>
  </main>
</body>
</html>
