<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shell/CardShell/Style05</title>
  <link rel="stylesheet" href="./shell.css">
  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #080b14;
      color: #15f6ee;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 40px;
    }

    .preview-stage {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, auto));
      gap: 32px;
      align-items: start;
    }

    .preview-card {
      position: relative;
    }

    .preview-card--base {
      width: 400px;
      height: 300px;
    }

    .preview-card--wide {
      width: 720px;
      height: 360px;
    }

    @media (max-width: 1220px) {
      body {
        place-items: start center;
        padding: 24px;
      }

      .preview-stage {
        grid-template-columns: 1fr;
      }

      .preview-card--wide {
        width: min(720px, calc(100vw - 48px));
      }
    }
  </style>
</head>
<body>
  <main class="preview-stage">
    <section class="preview-card preview-card--base">
      <section class="bs-card-shell bs-card-shell--style05" data-kit="Shell/CardShell/Style05">
        <div class="bs-card-shell__background" aria-hidden="true">
          <span class="bs-card-shell__fill"></span>
          <span class="bs-card-shell__top"></span>
          <span class="bs-card-shell__top-line"></span>
          <span class="bs-card-shell__top-dot"></span>
          <span class="bs-card-shell__top-right"></span>
          <span class="bs-card-shell__left-edge"></span>
          <span class="bs-card-shell__right-edge"></span>
          <span class="bs-card-shell__bottom"></span>
          <span class="bs-card-shell__bottom-left"></span>
          <span class="bs-card-shell__bottom-right"></span>
          <span class="bs-card-shell__left-top"></span>
          <span class="bs-card-shell__right-bottom"></span>
          <span class="bs-card-shell__bottom-line"></span>
        </div>
        <header class="bs-card-shell__header" data-node-id="29:28159">
          <h3 class="bs-card-shell__title" data-slot="title">卡片标题名称</h3>
          <span class="bs-card-shell__header-lines" aria-hidden="true">
            <span class="bs-card-shell__header-line bs-card-shell__header-line--short"></span>
            <span class="bs-card-shell__header-line bs-card-shell__header-line--long"></span>
          </span>
        </header>
        <div class="bs-card-shell__content" data-slot="content"></div>
      </section>
    </section>

    <section class="preview-card preview-card--wide">
      <section class="bs-card-shell bs-card-shell--style05" data-kit="Shell/CardShell/Style05">
        <div class="bs-card-shell__background" aria-hidden="true">
          <span class="bs-card-shell__fill"></span>
          <span class="bs-card-shell__top"></span>
          <span class="bs-card-shell__top-line"></span>
          <span class="bs-card-shell__top-dot"></span>
          <span class="bs-card-shell__top-right"></span>
          <span class="bs-card-shell__left-edge"></span>
          <span class="bs-card-shell__right-edge"></span>
          <span class="bs-card-shell__bottom"></span>
          <span class="bs-card-shell__bottom-left"></span>
          <span class="bs-card-shell__bottom-right"></span>
          <span class="bs-card-shell__left-top"></span>
          <span class="bs-card-shell__right-bottom"></span>
          <span class="bs-card-shell__bottom-line"></span>
        </div>
        <header class="bs-card-shell__header" data-node-id="29:28159">
          <h3 class="bs-card-shell__title" data-slot="title">宽屏自适应标题</h3>
          <span class="bs-card-shell__header-lines" aria-hidden="true">
            <span class="bs-card-shell__header-line bs-card-shell__header-line--short"></span>
            <span class="bs-card-shell__header-line bs-card-shell__header-line--long"></span>
          </span>
        </header>
        <div class="bs-card-shell__content" data-slot="content"></div>
      </section>
    </section>
  </main>
</body>
</html>
