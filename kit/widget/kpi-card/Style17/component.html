<section class="kpi-card kpi-card--style17" data-kit="widget/kpi-card/Style17" data-variant="blue">

    <span class="kpi-card__base"></span>
    <span class="kpi-card__dome"></span>
  </div>

    <span class="kpi-card__subtitle" data-slot="subtitle">（10%）</span>
