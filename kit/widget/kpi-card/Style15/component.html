<section class="kpi-card kpi-card--style15" data-kit="widget/kpi-card/Style15">
  <div class="kpi-card__panel-frame" aria-hidden="true"></div>
  <div class="kpi-card__value-stack">
    <span class="kpi-card__icon" aria-hidden="true"></span>
    <div class="kpi-card__metric">
      <strong class="kpi-card__value" data-slot="value">100</strong>
      <span class="kpi-card__unit" data-slot="unit">件</span>
    </div>
    <span class="kpi-card__label" data-slot="label">工单总量</span>
  </div>
</section>
